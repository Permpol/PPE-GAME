<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ภารกิจสวม PPE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: hazard-stripe header → three-panel workbench (tray | worker | feedback) → ISO-sign reference cards */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#16213a; --muted:#56617a; --line:#d3d9e2;
  --stage:#dde4ec; --fig-line:#1b2638;
  --hiviz:#f5c400; --hiviz-ink:#3a2e00; --sign:#1d5fa8; --sign-ink:#ffffff;
  --ok:#1d7f46; --ok-bg:#e3f4ea; --bad:#b93a26; --bad-bg:#fbe7e2;
  --display:"Bai Jamjuree","Anuphan",system-ui,sans-serif;
  --body:"Anuphan","Bai Jamjuree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#172030; --ink:#e8edf5; --muted:#9aa6ba; --line:#2a3547;
  --stage:#22304a; --fig-line:#c9d3e2; --hiviz:#f5c400; --hiviz-ink:#2a2100; --sign:#3b82d6; --sign-ink:#ffffff;
  --ok:#5bd08d; --ok-bg:#163326; --bad:#f08a72; --bad-bg:#3a1d17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#172030; --ink:#e8edf5; --muted:#9aa6ba; --line:#2a3547;
  --stage:#22304a; --fig-line:#c9d3e2; --hiviz:#f5c400; --hiviz-ink:#2a2100; --sign:#3b82d6; --sign-ink:#ffffff;
  --ok:#5bd08d; --ok-bg:#163326; --bad:#f08a72; --bad-bg:#3a1d17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--hiviz) 0 14px,#1a1a1a 14px 28px)}
header{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between;padding-block:24px 20px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.5vw,40px);line-height:1.15;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:var(--hiviz);color:var(--hiviz-ink);padding:0 .25em;border-radius:4px}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.status{display:flex;gap:10px;flex-wrap:wrap}
.chip{font-family:var(--display);font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums}
.chip b{color:var(--ink)}
.btn{font:600 14px var(--display);border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:focus-visible,.item:focus-visible{outline:3px solid var(--sign);outline-offset:2px}

.bench{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:960px){.bench{grid-template-columns:minmax(0,1fr)}}
.arena{position:relative;display:grid;grid-template-columns:minmax(62px,104px) minmax(0,1fr) minmax(62px,104px);grid-template-areas:"l s r" "b b b";gap:8px;padding:10px;border-radius:18px;background:#59636f;overflow:hidden}
.ring{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:0}
.ring-l{grid-area:l}.ring-r{grid-area:r}
.ring-b{grid-area:b;flex-direction:row;justify-content:center;flex-wrap:wrap}
.ring-b .item{flex:0 1 104px}
.arena .stage{grid-area:s;border-radius:12px;align-self:center}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);z-index:6;max-width:calc(100% - 20px);padding:8px 14px;border-radius:999px;font:600 13.5px/1.35 var(--display);text-align:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#1d7f46}.toast.bad{background:#b93a26}
.tip{color:var(--muted)}
@media (max-width:600px){
  header{padding-block:16px 12px;gap:10px}
  .chip,.btn{font-size:12.5px;padding:5px 10px}
  .lede{display:none}
  h1{font-size:24px}
  .arena{grid-template-columns:68px minmax(0,1fr) 68px;gap:5px;padding:6px;border-radius:14px}
  .ring{justify-content:center}
  .item span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .item{padding:6px 2px 5px;font-size:10.5px;border-radius:10px;gap:2px}
  .item svg{width:34px;height:34px}
  .ring{gap:6px}
  .ring-b .item{flex:0 1 68px}
  .start-card{padding:16px 14px}
  .start-card h2{font-size:22px}
}
.panel-h{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}


.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink);font:500 12.5px/1.3 var(--body);text-align:center}
.item svg{width:52px;height:52px;pointer-events:none}
.item:hover{border-color:var(--ink)}
.item[aria-pressed="true"]{border-color:var(--sign);box-shadow:0 0 0 3px color-mix(in srgb,var(--sign) 30%,transparent)}
.item.done{opacity:.4;cursor:default;border-style:dashed}
.item.done::after{content:"✓";position:absolute;top:4px;right:8px;color:var(--ok);font-weight:700}
.item.bad{opacity:.4;cursor:default;border-style:dashed}
.item.bad::after{content:"✕";position:absolute;top:4px;right:8px;color:var(--bad);font-weight:700}
.tip{margin:12px 0 0;font-size:13px;color:var(--muted)}

.stage{background:#59636f;border-radius:16px;padding:0;display:flex;justify-content:center;position:relative;overflow:hidden}
.stage::before{content:none}
.scene{pointer-events:none}
.start-dice{color:var(--ink)!important;font-weight:600;margin-bottom:4px!important}
.job-pick{display:flex;flex-direction:column;gap:4px;text-align:left;margin:0 0 12px}
.job-pick label{font:600 12.5px var(--display);color:var(--muted)}
.job-pick select{font:600 15px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;cursor:pointer}
.job-pick select:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
#fig{width:100%;max-width:330px;height:auto;max-height:72vh;position:relative;touch-action:manipulation}
#fig .o{stroke:#1b2638;stroke-width:2.2;stroke-linejoin:round}
.layer{opacity:0;transform:translateY(-10px);transition:opacity .35s ease,transform .35s cubic-bezier(.2,1.4,.4,1)}
.layer.on{opacity:1;transform:none}
#hl rect{fill:color-mix(in srgb,var(--hiviz) 28%,transparent);stroke:var(--hiviz);stroke-width:2.5;stroke-dasharray:7 5}
.stage.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.feedback{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.tag{display:inline-block;font:600 12px var(--display);letter-spacing:.05em;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--hiviz);color:var(--hiviz-ink)}
.feedback h3{font:700 21px/1.3 var(--display);margin:0 0 4px;text-wrap:balance}
.feedback .en{color:var(--muted);font-size:13px;margin:0 0 10px}
.feedback h4{font:600 13px var(--display);letter-spacing:.04em;margin:12px 0 4px;color:var(--muted)}
.feedback ul,.feedback ol{margin:0;padding-left:20px}
.feedback li{margin:2px 0}
.feedback p{margin:0}
.done-banner{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:600}

.ref{margin-top:48px}
.ref h2{font:700 26px/1.2 var(--display);margin:0 0 6px}
.ref .sub{color:var(--muted);margin:0 0 20px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:580px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-top{display:flex;gap:12px;align-items:center}
.sign{flex:none;width:52px;height:52px;border-radius:50%;background:var(--sign);display:grid;place-items:center}
.sign svg{width:34px;height:34px}
.card h3{font:700 17px/1.25 var(--display);margin:0}
.code{font:600 11.5px var(--display);color:var(--muted);letter-spacing:.05em}
.card h4{font:600 12.5px var(--display);color:var(--muted);margin:4px 0 0;letter-spacing:.04em}
.card ul{margin:0;padding-left:18px;font-size:14px}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
@media (max-width:700px){.notes{grid-template-columns:minmax(0,1fr)}}
.note{border-left:5px solid var(--hiviz);background:var(--surface);border-radius:4px 12px 12px 4px;padding:14px 16px}
.note h3{font:700 16px var(--display);margin:0 0 6px}
.note ol{margin:0;padding-left:20px}
.timer{min-width:118px;text-align:center}
.timer.run{border-color:var(--hiviz);background:color-mix(in srgb,var(--hiviz) 18%,var(--surface))}
.timer.end{border-color:var(--ok);color:var(--ok)}
.start-ov{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(15,21,32,.55);backdrop-filter:blur(2px)}
.start-ov[hidden]{display:none!important}
.start-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px 20px;text-align:center;max-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.start-card h2{font:700 26px/1.2 var(--display);margin:2px 0 8px}
.start-card p{margin:0 0 14px;color:var(--muted);font-size:14px}
.start-k{font:600 12px var(--display)!important;letter-spacing:.06em;color:var(--bad)!important;margin:0!important}
.btn-start{font:700 18px var(--display);background:var(--hiviz);color:var(--hiviz-ink);border:2px solid #1a1a1a;border-radius:999px;padding:10px 28px;cursor:pointer}
.btn-start:hover{filter:brightness(1.07)}
.btn-start:focus-visible{outline:3px solid var(--sign);outline-offset:3px}
.arena.locked .item{opacity:.55;cursor:not-allowed}
.ghost{position:fixed;left:0;top:0;width:68px;height:68px;pointer-events:none;z-index:50;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
@media (prefers-reduced-motion:reduce){.layer{transition:none}.stage.shake{animation:none}}
</style>

<div class="stripe" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <h1>ภารกิจสวม <em>PPE</em> <span id="jobTitle"></span></h1>
      <p class="lede" id="lede"></p>
    </div>

      <span class="chip">สวมแล้ว <b id="count">0</b>/<span id="total">0</span></span>

      <button class="btn" id="reset" type="button">เริ่มใหม่</button>
      <button class="btn" id="musicBtn" type="button" aria-pressed="true" title="เปิด/ปิดเพลงและเสียงประกอบ">🔊 เพลง: เปิด</button>
    </div>

    <li>ถอดโดยดึงที่ข้อมือ ไม่ใช้ปากหรือมือเปล่าจับปลายนิ้วถุงมือที่ยังร้อน</li></ol></div>

    <li>ใส่เสื้อผ้าชั้นในที่ทำจากผ้าฝ้าย ไม่ใช่ผ้าใยสังเคราะห์ที่ละลายติดผิว</li>

    <li>ย้ายวัสดุติดไฟออกจากรัศมีงาน และเตรียมถังดับเพลิงไว้ใกล้มือ</li>

const SONG={"mel": [72, -1, 76, 79, 76, -1, 72, 74, 76, -1, 72, 69, 72, -1, -1, -1, 77, -1, 76, 74, 72, -1, 74, 76, 74, -1, 71, 67, 71, 74, -1, -1, 79, -1, 79, 76, 84, -1, 79, 76, 81, -1, 79, 76, 72, -1, 76, -1, 77, 76, 74, 72, 74, -1, 77, 76, 74, -1, 71, 74, 79, -1, -1, -1], "bass": [48, -1, 55, -1, 60, -1, 55, -1, 45, -1, 52, -1, 57, -1, 52, -1, 41, -1, 48, -1, 53, -1, 48, -1, 43, -1, 50, -1, 55, -1, 50, -1, 48, -1, 55, -1, 60, -1, 55, -1, 45, -1, 52, -1, 57, -1, 52, -1, 41, -1, 48, -1, 53, -1, 48, -1, 43, -1, 50, -1, 55, -1, 50, -1], "drum": [1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2, 1, 2, 3, 2], "bpm": 132};
const SND=(()=>{
  let ctx=null,master=null,on=true,playing=false,timer=null,step=0,nextT=0,speed=1;
  const hz=n=>440*Math.pow(2,(n-69)/12);
  function init(){if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();master=ctx.createGain();master.gain.value=on?0.5:0;master.connect(ctx.destination);return true}
  function tone(n,t,d,type,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=hz(n);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0008,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02)}
  let nbuf=null;
  function noise(t,d,vol,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*0.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type='highpass';f.frequency.value=hp;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.02)}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.16)}
  const stepDur=()=>60/(SONG.bpm*speed)/2;
  function sched(){while(nextT<ctx.currentTime+0.12){const i=step%SONG.mel.length,d=stepDur(),m=SONG.mel[i],b=SONG.bass[i],r=SONG.drum[i];
      if(m>=0)tone(m,nextT,d*0.95,'square',0.10);
      if(b>=0)tone(b,nextT,d*1.8,'triangle',0.30);
      noise(nextT,0.03,0.05,7000);if(r===1)kick(nextT);if(r===3)noise(nextT,0.12,0.16,1500);
      nextT+=d;step++}}
  return{
    start(){if(!init())return;ctx.resume();this.stop();step=0;speed=1;nextT=ctx.currentTime+0.06;playing=true;timer=setInterval(sched,25);sched()},
    stop(){playing=false;if(timer){clearInterval(timer);timer=null}},
    setSpeed(v){speed=v},
    ok(){if(!init())return;const t=ctx.currentTime;tone(84,t,0.09,'square',0.16);tone(91,t+0.08,0.16,'square',0.16)},
    bad(){if(!init())return;const t=ctx.currentTime;tone(46,t,0.16,'sawtooth',0.18);tone(45,t+0.15,0.24,'sawtooth',0.18)},
    click(){if(!init())return;tone(79,ctx.currentTime,0.05,'square',0.08)},
    win(){if(!init())return;this.stop();let t=ctx.currentTime+0.05;[[72,.12],[76,.12],[79,.12],[84,.5]].forEach(([n,d])=>{tone(n,t,d,'square',0.16);tone(n-24,t,d,'triangle',0.3);t+=d});
      [76,79,84].forEach(n=>tone(n,t-0.5,0.6,'square',0.06))},
    toggle(){on=!on;if(master)master.gain.setTargetAtTime(on?0.5:0,ctx.currentTime,0.02);return on},
    get on(){return on}
  }})();

function iconSvg(id,set=ICON){return `<svg viewBox="0 0 64 64" aria-hidden="true">${set[id]}</svg>`}
function byId(id){return ITEMS.find(i=>i.id===id)}

function buildTray(){
  const rings=[$('#ringL'),$('#ringR'),$('#ringB')];rings.forEach(r=>r.innerHTML='');
  const n=ORDER.length,side=Math.min(4,Math.ceil(n/2));
  ORDER.forEach((id,i)=>{const it=byId(id);
    const ring=i<side?rings[0]:i<side*2?rings[1]:rings[2];
    const b=document.createElement('button');b.type='button';b.className='item';b.id='item-'+id;b.dataset.id=id;
    b.setAttribute('aria-pressed','false');b.innerHTML=iconSvg(id)+`<span>${it.name}</span>`;
    attachDrag(b);ring.appendChild(b);});
}

function toSvg(cx,cy){const p=new DOMPoint(cx,cy).matrixTransform(svg.getScreenCTM().inverse());return p}
function inRects(rs,p){return rs.some(([x,y,w,h])=>p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h)}
function zoneAt(p){let best=null,area=1e9;for(const [z,rs] of Object.entries(ZONES)){for(const r of rs){if(inRects([r],p)&&r[2]*r[3]<area){area=r[2]*r[3];best=z}}}return best}
function highlight(z){hl.innerHTML=z?ZONES[z].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/>`).join(''):''}

function attachDrag(el){
  let st=null,ghost=null;
  el.addEventListener('pointerdown',e=>{
    if(!started||el.classList.contains('done')||el.classList.contains('bad'))return;
    st={x:e.clientX,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(!st)return;
    if(!st.moved&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>6){
      st.moved=true;ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=iconSvg(el.dataset.id);
      ghost.firstChild.style.cssText='width:100%;height:100%';document.body.appendChild(ghost);select(null);}
    if(st.moved){ghost.style.transform=`translate(${e.clientX-34}px,${e.clientY-34}px)`;
      const r=svg.getBoundingClientRect();
      const over=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
      highlight(over?zoneAt(toSvg(e.clientX,e.clientY)):null);}
  });
  const end=(e,cancel)=>{
    if(!st)return;const moved=st.moved;st=null;
    if(ghost){ghost.remove();ghost=null}highlight(null);
    if(cancel)return;
    if(moved)drop(el.dataset.id,e.clientX,e.clientY);
    else select(selected===el.dataset.id?null:el.dataset.id);
  };
  el.addEventListener('pointerup',e=>end(e,false));
  el.addEventListener('pointercancel',e=>end(e,true));
  el.addEventListener('click',e=>{if(started&&e.detail===0&&!el.classList.contains('done')&&!el.classList.contains('bad'))select(selected===el.dataset.id?null:el.dataset.id)});
}
function select(id){
  selected=id;document.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id?'true':'false'));
  if(id&&placed.size<REQ)showInfo(`เลือก “${byId(id).name}” แล้ว`,'แตะตำแหน่งบนตัวพนักงานที่ต้องสวมอุปกรณ์ชิ้นนี้');
}
svg.addEventListener('click',e=>{if(!started||!selected)return;const id=selected;select(null);drop(id,e.clientX,e.clientY)});

function drop(id,cx,cy){
  if(!started)return;
  const r=svg.getBoundingClientRect();
  if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return;
  const p=toSvg(cx,cy),z=zoneAt(p),it=byId(id);
  if(!z)return;
  if(it.distractor){mistake();bad.add(id);$('#item-'+id).classList.add('bad');
    return showResult(false,it.name+' ใช้แทน PPE ไม่ได้',null,`<p>${it.why}</p>`)}
  if(!inRects(ZONES[it.zone],p)){mistake();return showResult(false,'ยังไม่ใช่ตำแหน่งของ'+it.name,null,`<p>${it.hint}</p>`)}
  if(it.needs&&!placed.has(it.needs)){mistake();
    return showResult(false,'สวม'+byId(it.needs).name+'ก่อน',null,`<p>${it.needMsg}</p>`)}
  placed.add(id);if(placed.size<REQ)SND.ok();if(REQ-placed.size===1)SND.setSpeed(1.15);$('#item-'+id).classList.add('done');$('#L-'+id).classList.add('on');
  $('#count').textContent=placed.size;
  let fin='';
  if(placed.size===REQ){SND.win();stopTimer();started=false;elapsed=performance.now()-t0;$('#time').textContent=fmt(elapsed);
    $('#timerChip').classList.remove('run');$('#timerChip').classList.add('end');
    const pb=bestBy[lastKey];const nb=pb===undefined||elapsed<pb;if(nb)bestBy[lastKey]=elapsed;$('#best').textContent=fmt(bestBy[lastKey]);$('#bestChip').hidden=false;
    fin=` · เวลา ${fmt(elapsed)}${nb?' (สถิติใหม่!)':''}`;}
  showResult(true,it.name,it.en,`<h4>ป้องกันอะไร</h4><ul>${it.protects.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h4>สวมให้ถูกต้อง</h4><ul>${it.howto.map(x=>`<li>${x}</li>`).join('')}</ul>`+
    (placed.size===REQ?`<div class="done-banner">${SC.done} · พลาด ${miss} ครั้ง${fin}${miss===0?' ยอดเยี่ยม!':''}<br><button class="btn" type="button" onclick="document.getElementById('reset').click()" style="margin-top:8px">เล่นอีกครั้ง</button></div>`:''));
}
function mistake(){SND.bad();miss++;$('#miss').textContent=miss;stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake')}
let toastT=null;
function toast(ok,msg){const t=$('#toast');t.textContent=(ok?'✓ ':'✕ ')+msg;t.className='toast show '+(ok?'ok':'bad');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900)}
function showResult(ok,title,en,html){
  toast(ok,title);
  fb.innerHTML=`<span class="tag ${ok?'ok':'bad'}">${ok?'ถูกต้อง':'ลองใหม่'}</span><h3>${title}</h3>${en?`<p class="en">${en}</p>`:''}${html}`;
}
function showInfo(title,text){fb.innerHTML=`<span class="tag info">วิธีเล่น</span><h3>${title}</h3><p>${text}</p>`}
function reset(){
  placed=new Set();bad=new Set();miss=0;selected=null;
  SND.stop();stopTimer();started=false;elapsed=0;$('#time').textContent=fmt(0);
  $('#timerChip').classList.remove('run','end');$('#startOv').hidden=false;
  $('#count').textContent=0;$('#miss').textContent=0;
  document.querySelectorAll('.layer').forEach(l=>l.classList.remove('on'));
  const key=pickScenario();
  $('#startMode').textContent=jobChoice==='random'?'🎲 สุ่มได้: '+SC.name:'✅ เลือกงาน: '+SC.name;
  document.querySelectorAll('.scene').forEach(g=>g.style.display=g.id===SC.scene?'':'none');
  stage.style.background=SC.bg;tray.style.background=SC.bg;
  $('#jobTitle').textContent=SC.name;$('#lede').textContent=SC.lede;$('#tip').textContent=SC.tip;
  $('#total').textContent=REQ;$('#startJob').textContent=SC.name;
  $('#startTxt').textContent=REQ===1?'หาอุปกรณ์ที่ถูกต้องเพียงชิ้นเดียวให้เร็วที่สุด เวลาจะเริ่มนับทันทีที่กดปุ่ม':`สวม PPE ให้ครบ ${REQ} ชิ้นให้เร็วที่สุด เวลาจะเริ่มนับทันทีที่กดปุ่ม`;
  $('#refh').textContent=`คู่มือ PPE ${SC.name} ${REQ} ชิ้น`;$('#refsub').textContent=SC.refsub;$('#notes').innerHTML=SC.notes;
  document.title='ภารกิจสวม PPE '+SC.name;
  if(bestBy[key]!==undefined){$('#best').textContent=fmt(bestBy[key]);$('#bestChip').hidden=false}else{$('#bestChip').hidden=true}
  buildCards();buildTray();tray.classList.add('locked');
  fb.innerHTML=`<span class="tag info">วิธีเล่น</span><h3>${SC.head}</h3>
   <p>${SC.story} มีอุปกรณ์ที่ถูกต้อง ${REQ} ชิ้น และของหลอกอีก ${ITEMS.length-REQ} ชิ้น</p>
   <h4>ทำอย่างไร</h4><ol><li>ลากอุปกรณ์ที่วางอยู่รอบฉากไปวางบนร่างกาย</li><li>วางถูกตำแหน่ง อุปกรณ์จะสวมให้ทันที พร้อมคำอธิบายว่าป้องกันอะไร</li><li>กดปุ่ม <b>เริ่มเกม</b> เวลาจะเริ่มนับพร้อมเพลงประกอบ และหยุดเมื่อสวมครบ (ปิดเพลงได้ที่ปุ่ม 🔊)</li><li>วางผิดตำแหน่ง สวมผิดลำดับ หรือเลือกของหลอก จะนับเป็นการพลาด</li></ol>`;
}
$('#reset').addEventListener('click',reset);
$('#startBtn').addEventListener('click',startGame);
(()=>{const sel=$('#jobSel');
  sel.innerHTML='<option value="random">🎲 สุ่มประเภทงาน</option>'+Object.entries(SCEN).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
  sel.addEventListener('change',()=>{jobChoice=sel.value;reset();sel.focus()});})();
$('#musicBtn').addEventListener('click',e=>{const v=SND.toggle();e.currentTarget.textContent=v?'🔊 เพลง: เปิด':'🔇 เพลง: ปิด';e.currentTarget.setAttribute('aria-pressed',v)});
reset();
</script>

</body></html>
